<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 COBER360 - Dashboard de Performance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-item {
            background: rgba(255,255,255,0.9);
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            min-width: 150px;
        }
        
        .status-excellent { border-left: 5px solid #4CAF50; }
        .status-good { border-left: 5px solid #8BC34A; }
        .status-warning { border-left: 5px solid #FF9800; }
        .status-critical { border-left: 5px solid #f44336; }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }
        
        .metric-card:hover {
            transform: translateY(-5px);
        }
        
        .metric-card h3 {
            color: #5a67d8;
            margin-bottom: 15px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .metric-row:last-child {
            border-bottom: none;
        }
        
        .metric-label {
            font-weight: 500;
            color: #666;
        }
        
        .metric-value {
            font-weight: bold;
            color: #333;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin: 5px 0;
        }
        
        .progress-fill {
            height: 100%;
            transition: width 0.3s ease;
        }
        
        .progress-good { background: #4CAF50; }
        .progress-warning { background: #FF9800; }
        .progress-critical { background: #f44336; }
        
        .logs-section {
            background: rgba(0,0,0,0.8);
            color: #0f0;
            border-radius: 10px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .timestamp {
            color: #888;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 20px;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
        }
        
        .error {
            background: #f44336;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
        
        .refresh-btn {
            background: #5a67d8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s ease;
            margin: 10px;
        }
        
        .refresh-btn:hover {
            background: #4c51bf;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 COBER360 Dashboard</h1>
            <p>Monitoreo de Performance en Tiempo Real</p>
        </div>
        
        <div class="status-bar">
            <div class="status-item" id="overall-status">
                <h3>Estado General</h3>
                <div id="status-value">Cargando...</div>
            </div>
            <div class="status-item">
                <h3>Uptime</h3>
                <div id="uptime-value">--</div>
            </div>
            <div class="status-item">
                <h3>Requests/min</h3>
                <div id="rpm-value">--</div>
            </div>
            <div class="status-item">
                <h3>Última Actualización</h3>
                <div id="last-update">--</div>
            </div>
        </div>
        
        <div class="metrics-grid" id="metrics-container">
            <div class="loading">🔄 Cargando métricas...</div>
        </div>
        
        <div class="logs-section">
            <h3>📊 Logs del Sistema</h3>
            <div id="logs-content">Conectando al stream de logs...</div>
        </div>
        
        <div class="timestamp">
            <button class="refresh-btn" onclick="window.location.reload()">🔄 Refrescar</button>
            <button class="refresh-btn" onclick="resetMetrics()">🔄 Reset Contadores</button>
        </div>
    </div>

    <script>
        let eventSource;
        let isConnected = false;
        
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function formatUptime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return `${hours}h ${minutes}m`;
        }
        
        function getProgressClass(value, thresholds) {
            if (value > thresholds.critical) return 'progress-critical';
            if (value > thresholds.warning) return 'progress-warning';
            return 'progress-good';
        }
        
        function createMetricCard(title, icon, metrics) {
            return `
                <div class="metric-card">
                    <h3>${icon} ${title}</h3>
                    ${metrics.map(metric => `
                        <div class="metric-row">
                            <span class="metric-label">${metric.label}</span>
                            <span class="metric-value">${metric.value}</span>
                        </div>
                        ${metric.progress ? `
                            <div class="progress-bar">
                                <div class="progress-fill ${metric.progress.class}" 
                                     style="width: ${metric.progress.value}%"></div>
                            </div>
                        ` : ''}
                    `).join('')}
                </div>
            `;
        }
        
        function updateMetrics(data) {
            if (data.error) {
                document.getElementById('metrics-container').innerHTML = 
                    `<div class="error">❌ Error: ${data.error}</div>`;
                return;
            }
            
            const metrics = data.metrics;
            
            // Actualizar estado general
            const statusElement = document.getElementById('overall-status');
            statusElement.className = `status-item status-${data.health.status}`;
            document.getElementById('status-value').innerHTML = 
                `${data.health.status.toUpperCase()}<br><small>Score: ${data.health.score}</small>`;
            
            // Actualizar valores del header
            document.getElementById('uptime-value').textContent = 
                formatUptime(metrics.node.uptime);
            document.getElementById('rpm-value').textContent = 
                metrics.application.performance.requestsPerMinute;
            document.getElementById('last-update').textContent = 
                new Date().toLocaleTimeString();
            
            // Crear cards de métricas
            const container = document.getElementById('metrics-container');
            container.innerHTML = '';
            
            // Sistema
            container.innerHTML += createMetricCard('Sistema', '🖥️', [
                { 
                    label: 'CPU Usage', 
                    value: `${metrics.system.cpu.usage.toFixed(1)}%`,
                    progress: {
                        value: metrics.system.cpu.usage,
                        class: getProgressClass(metrics.system.cpu.usage, {warning: 60, critical: 80})
                    }
                },
                { 
                    label: 'Memory Usage', 
                    value: `${metrics.system.memory.usage}% (${metrics.system.memory.used} MB)`,
                    progress: {
                        value: metrics.system.memory.usage,
                        class: getProgressClass(metrics.system.memory.usage, {warning: 70, critical: 85})
                    }
                },
                { label: 'CPU Cores', value: metrics.system.cpu.cores },
                { label: 'Platform', value: `${metrics.system.platform.platform} ${metrics.system.platform.arch}` }
            ]);
            
            // Node.js
            container.innerHTML += createMetricCard('Node.js', '🚀', [
                { 
                    label: 'Heap Usage', 
                    value: `${metrics.node.memory.heapUsage}% (${metrics.node.memory.heapUsed} MB)`,
                    progress: {
                        value: metrics.node.memory.heapUsage,
                        class: getProgressClass(metrics.node.memory.heapUsage, {warning: 70, critical: 85})
                    }
                },
                { label: 'RSS Memory', value: `${metrics.node.memory.rss} MB` },
                { label: 'Process ID', value: metrics.node.pid },
                { label: 'Node Version', value: metrics.node.version }
            ]);
            
            // Aplicación
            container.innerHTML += createMetricCard('Aplicación', '📱', [
                { label: 'Total Requests', value: metrics.application.requests.total },
                { label: 'Success Rate', value: `${100 - metrics.application.requests.errorRate}%` },
                { 
                    label: 'Error Rate', 
                    value: `${metrics.application.requests.errorRate}%`,
                    progress: {
                        value: metrics.application.requests.errorRate,
                        class: getProgressClass(metrics.application.requests.errorRate, {warning: 5, critical: 10})
                    }
                },
                { label: 'Avg Response Time', value: `${metrics.application.performance.avgResponseTime} ms` }
            ]);
            
            // Base de Datos
            if (metrics.database.status === 'connected') {
                container.innerHTML += createMetricCard('Base de Datos', '🗄️', [
                    { 
                        label: 'Conexiones Activas', 
                        value: `${metrics.database.connections.active}/${metrics.database.connections.max}`,
                        progress: {
                            value: metrics.database.connections.usage,
                            class: getProgressClass(metrics.database.connections.usage, {warning: 70, critical: 85})
                        }
                    },
                    { label: 'Queries/seg', value: metrics.database.queries.perSecond },
                    { label: 'Total Queries', value: metrics.database.queries.total.toLocaleString() },
                    { label: 'DB Uptime', value: formatUptime(metrics.database.uptime) }
                ]);
            } else {
                container.innerHTML += createMetricCard('Base de Datos', '🗄️', [
                    { label: 'Estado', value: '❌ Error de conexión' },
                    { label: 'Error', value: metrics.database.error || 'Desconocido' }
                ]);
            }
            
            // Red
            container.innerHTML += createMetricCard('Red', '🌐', [
                { label: 'Conexiones HTTP (:80)', value: metrics.network.connections.http },
                { label: 'Conexiones HTTPS (:443)', value: metrics.network.connections.https },
                { label: 'Conexiones App (:4000)', value: metrics.network.connections.app }
            ]);
            
            // Problemas detectados
            if (data.health.issues.length > 0) {
                container.innerHTML += createMetricCard('⚠️ Problemas Detectados', '🚨', 
                    data.health.issues.map(issue => ({ label: '•', value: issue }))
                );
            }
        }
        
        function connectEventSource() {
            if (eventSource) {
                eventSource.close();
            }
            
            eventSource = new EventSource('/performance/stream');
            
            eventSource.onopen = function() {
                isConnected = true;
                document.getElementById('logs-content').innerHTML = '✅ Conectado al servidor...\n';
            };
            
            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    updateMetrics(data);
                    
                    // Agregar a logs
                    const logsContent = document.getElementById('logs-content');
                    const timestamp = new Date().toLocaleTimeString();
                    logsContent.innerHTML += `[${timestamp}] ✅ Métricas actualizadas - Status: ${data.health?.status || 'unknown'}\n`;
                    logsContent.scrollTop = logsContent.scrollHeight;
                    
                } catch (error) {
                    console.error('Error parsing SSE data:', error);
                }
            };
            
            eventSource.onerror = function() {
                isConnected = false;
                document.getElementById('logs-content').innerHTML += '❌ Error de conexión. Reintentando...\n';
                setTimeout(() => {
                    if (!isConnected) {
                        connectEventSource();
                    }
                }, 5000);
            };
        }
        
        function resetMetrics() {
            fetch('/performance/reset', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    alert('✅ Contadores reseteados correctamente');
                })
                .catch(error => {
                    alert('❌ Error reseteando contadores: ' + error.message);
                });
        }
        
        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            connectEventSource();
            
            // Cleanup al cerrar la página
            window.addEventListener('beforeunload', function() {
                if (eventSource) {
                    eventSource.close();
                }
            });
        });
    </script>
</body>
</html>
